# Grimoire book configuration for the @deckyard/zmachine documentation.

[book]
title = "@deckyard/zmachine"
description = "A Z-machine interpreter for Jennifer: plays Infocom and Inform games."
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-zmachine/"
logo = "deckyard.svg"
favicon = "deckyard.svg"
repoUrl = "https://github.com/deckyard/deck-zmachine"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-zmachine/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
