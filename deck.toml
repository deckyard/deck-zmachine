[package]
name = "@deckyard/zmachine"
version = "0.1.0"
description = "A Z-machine interpreter: plays Infocom and Inform games (versions 3, 4, 5, 7 and 8)"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
capabilities = []
keywords = [
    "z-machine",
    "infocom",
    "inform",
    "interactive-fiction",
    "text-adventure",
    "interpreter",
    "quetzal",
    "retrocomputing",
]

[package.urls]
deck = "https://raw.githubusercontent.com/deckyard/deck-zmachine/main/deck.toml"
homepage = "https://github.com/deckyard/deck-zmachine"
manual = "https://deckyard.github.io/deck-zmachine/"

[engines]
jennifer = ">=0.25.0"
jennifer-tiny = ">=0.25.0"
